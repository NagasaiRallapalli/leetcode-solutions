name: Update LeetCode Progress

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README progress
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          TOTAL_PROBLEMS = 335

          # Count problem folders inside Arrays
          arrays_path = Path("Arrays")
          excluded = {"README.md", ".git"}

          if arrays_path.exists():
              arrays_count = sum(
                  1
                  for item in arrays_path.iterdir()
                  if item.is_dir() and item.name not in excluded
              )
          else:
              arrays_count = 0

          # Count all problem folders inside category folders
          total_uploaded = 0

          for category in Path(".").iterdir():
              if not category.is_dir():
                  continue

              if category.name.startswith("."):
                  continue

              for item in category.iterdir():
                  if item.is_dir() and item.name not in excluded:
                      total_uploaded += 1

          # Calculate progress
          percentage = (total_uploaded / TOTAL_PROBLEMS) * 100

          # Create progress bar
          bar_length = 30
          filled = round((total_uploaded / TOTAL_PROBLEMS) * bar_length)
          progress_bar = "█" * filled + "░" * (bar_length - filled)

          # -----------------------------
          # Update MAIN README
          # -----------------------------

          main_readme = Path("README.md")

          if main_readme.exists():
              text = main_readme.read_text(encoding="utf-8")

              # Update Arrays count
              text = re.sub(
                  r'(\| 📚 Arrays\s+\|)\s*\d+(\s*\|)',
                  rf'\g<1> {arrays_count}\2',
                  text
              )

              # Update total uploaded count
              text = re.sub(
                  r'(\|\s*\*\*335\*\*\s*\|)\s*\*\*\d+\*\*',
                  rf'\g<1> **{total_uploaded}**',
                  text
              )

              main_readme.write_text(text, encoding="utf-8")

          # -----------------------------
          # Update ARRAYS README
          # -----------------------------

          arrays_readme = Path("Arrays/README.md")

          if arrays_readme.exists():
              text = arrays_readme.read_text(encoding="utf-8")

              # Update uploaded count
              text = re.sub(
                  r'Uploaded\s*:\s*\d+\s*Problems',
                  f'Uploaded : {arrays_count} Problems',
                  text
              )

              # Update progress bar
              text = re.sub(
                  r'^[█░]+\s*(?:\d+\s*)*$',
                  f'{progress_bar} {arrays_count}',
                  text,
                  flags=re.MULTILINE
              )

              arrays_readme.write_text(text, encoding="utf-8")

          print(f"Total uploaded: {total_uploaded}")
          print(f"Arrays uploaded: {arrays_count}")
          print(f"Progress: {percentage:.2f}%")
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md Arrays/README.md

          git diff --cached --quiet || git commit -m "Update LeetCode progress"

          git push
